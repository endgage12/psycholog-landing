version: '3.9'

services:
  frontend:
    build:
      context: ./frontend
    env_file:
      - .env.frontend
    ports:
      - '8400:8000'
    volumes:
      - psy-frontend-dist:/app/dist

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - psy-frontend-dist:/usr/share/nginx/html
    ports:
      - '84:80'     # HTTP для редиректа или валидации (если понадобится)
      - '446:443'   # HTTPS (незаменимый порт для вашего случая)
    depends_on:
      - frontend

volumes:
  psy-frontend-dist:
